spring.application.name=medical_billing
# DB Connection Params
spring.datasource.url=jdbc:mysql://localhost:3306/careassist_db?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=Root

# hibernate settings
spring.jpa.hibernate.ddl-auto=update

# secret key
